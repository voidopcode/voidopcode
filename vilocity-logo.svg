<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151926"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- chip pins -->
  <g fill="#7c5cff" opacity="0.55">
    <rect x="156" y="24" width="20" height="48" rx="4"/><rect x="216" y="24" width="20" height="48" rx="4"/><rect x="276" y="24" width="20" height="48" rx="4"/><rect x="336" y="24" width="20" height="48" rx="4"/>
    <rect x="156" y="440" width="20" height="48" rx="4"/><rect x="216" y="440" width="20" height="48" rx="4"/><rect x="276" y="440" width="20" height="48" rx="4"/><rect x="336" y="440" width="20" height="48" rx="4"/>
    <rect x="24" y="156" width="48" height="20" rx="4"/><rect x="24" y="216" width="48" height="20" rx="4"/><rect x="24" y="276" width="48" height="20" rx="4"/><rect x="24" y="336" width="48" height="20" rx="4"/>
    <rect x="440" y="156" width="48" height="20" rx="4"/><rect x="440" y="216" width="48" height="20" rx="4"/><rect x="440" y="276" width="48" height="20" rx="4"/><rect x="440" y="336" width="48" height="20" rx="4"/>
  </g>
  <!-- chip body -->
  <rect x="72" y="72" width="368" height="368" rx="56" fill="url(#bg)" stroke="#7c5cff" stroke-width="10"/>
  <!-- speed lines -->
  <g stroke="#3ddc84" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="104" y1="190" x2="140" y2="190"/>
    <line x1="96" y1="236" x2="156" y2="236"/>
    <line x1="108" y1="282" x2="172" y2="282"/>
  </g>
  <!-- the V -->
  <path d="M176 144 L256 368 L336 144" fill="none" stroke="url(#v)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head pointing right, to Windows -->
  <path d="M352 236 l44 0 m-18 -20 l20 20 l-20 20" fill="none" stroke="#e6ecf5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
